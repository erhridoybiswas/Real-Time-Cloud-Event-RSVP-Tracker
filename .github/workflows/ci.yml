name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          JWT_SECRET: ci-jwt-secret
          SECRET_KEY: ci-secret
          BOOTSTRAP_KEY: ci-bootstrap
          DATABASE_PATH: ./data/ci.db
        run: pytest -v --tb=short

      - name: Smoke-test the app boots
        env:
          JWT_SECRET: ci-jwt-secret
          SECRET_KEY: ci-secret
          DATABASE_PATH: ./data/smoke.db
        run: python -c "from backend.app import app; print('App loaded:', app.name)"